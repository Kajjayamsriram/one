# Starter pipeline

trigger:
- master

pool:
  name: beta_pool
  demands:
    - Agent.Name -equals slave-server

steps:
- task: Maven@4
  inputs:
    azureSubscription: 'Azure subscription 1(eaa9d61d-1afc-49a4-a26f-b8ac0647fcb0)'
    mavenPomFile: 'pom.xml'
    publishJUnitResults: true
    testResultsFiles: '**/surefire-reports/TEST-*.xml'
    javaHomeOption: 'JDKVersion'
    mavenVersionOption: 'Default'
    mavenAuthenticateFeed: false
    effectivePomSkip: false
    sonarQubeRunAnalysis: false

- script: |
    echo "listing war file"
    find $(System.DefaultWorkingDirectory) -name "*.war"
  displayName: 'List war file'

- script: |
    cd $(System.DefaultWorkingDirectory)
    docker buildx build -t myimage --load .
  displayName: 'Build Docker Image'

- task: CmdLine@2
  inputs:
    script: 'docker run -d --name cont -p 8081:8080 myimage'
- task: TomcatDeployment@1
  inputs:
    TomcatUrl: 'http://20.253.147.168:8080/'
    Username: 'tomcat'
    Password: 'admin@123'
    warFile: '$(System.DefaultWorkingDirectory)/target/myweb-8.6.12.war'
    Context: '/demo'
    ServerVersion: '7OrAbove'

